name: Check kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/image-zoom/requirements.txt
      - run: python scripts/check.py
      - run: python -m unittest discover -s tests -v
      - name: Install numerical helper dependency
        run: python -m pip install "numpy>=1.26,<3"
      - run: python -m unittest discover -s skills/nature-figure/tests -v
