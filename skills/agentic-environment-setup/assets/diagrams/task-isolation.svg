<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="title desc">
  <title id="title">Separate state when the task needs it</title>
  <desc id="desc">Two independent task panels. Task A uses worktree A, a preview on port 8081, and disposable state A. Task B uses worktree B, a preview on port 8082, and disposable state B. No connections join the tasks.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="900" height="340" rx="16" fill="#f8fafc"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="28" y="38" fill="#172b42" font-size="20" font-weight="600">Separate state when the task needs it</text>
    <rect x="24" y="58" width="852" height="122" rx="12" fill="#f0f8f6" stroke="#b6d8d0" stroke-width="1.5"/>
    <rect x="24" y="194" width="852" height="122" rx="12" fill="#f0f5fb" stroke="#c1d2e6" stroke-width="1.5"/>
    <text x="43" y="85" fill="#0f766e" font-size="14" font-weight="700" letter-spacing="1">TASK A</text>
    <text x="43" y="221" fill="#245c91" font-size="14" font-weight="700" letter-spacing="1">TASK B</text>
    <g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 255 131 H 321"/>
      <path d="M 565 131 H 631"/>
      <path d="M 255 267 H 321"/>
      <path d="M 565 267 H 631"/>
    </g>
    <g fill="#ffffff" stroke="#b6d8d0" stroke-width="1.5">
      <rect x="43" y="98" width="212" height="66" rx="9"/>
      <rect x="324" y="98" width="241" height="66" rx="9"/>
      <rect x="634" y="98" width="223" height="66" rx="9"/>
    </g>
    <g fill="#ffffff" stroke="#c1d2e6" stroke-width="1.5">
      <rect x="43" y="234" width="212" height="66" rx="9"/>
      <rect x="324" y="234" width="241" height="66" rx="9"/>
      <rect x="634" y="234" width="223" height="66" rx="9"/>
    </g>
    <g fill="#172b42" font-size="19" font-weight="600" text-anchor="middle">
      <text x="149" y="138">Worktree A</text>
      <text x="444.5" y="125"><tspan x="444.5">Preview on</tspan><tspan x="444.5" dy="25">port 8081</tspan></text>
      <text x="745.5" y="125"><tspan x="745.5">Disposable</tspan><tspan x="745.5" dy="25">state A</tspan></text>
      <text x="149" y="274">Worktree B</text>
      <text x="444.5" y="261"><tspan x="444.5">Preview on</tspan><tspan x="444.5" dy="25">port 8082</tspan></text>
      <text x="745.5" y="261"><tspan x="745.5">Disposable</tspan><tspan x="745.5" dy="25">state B</tspan></text>
    </g>
  </g>
</svg>
